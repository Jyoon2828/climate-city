<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#244e47"><title>기후 안심 마을 설계소</title><link rel="stylesheet" href="style.css"><script src="landscape.js" defer></script><script src="engine.js" defer></script><script src="city.js" defer></script><script src="movie.js" defer></script><link rel="stylesheet" href="reading.css"><script src="reading-art.js" defer></script><script src="reading.js" defer></script><script src="app.js" defer></script></head>
<body>
<header>
  <div class="brand"><span class="brandmark" aria-hidden="true">▥</span><div><small>초등 과학 · 기후변화</small><h1>기후 안심 마을 설계소</h1></div></div>
  <nav aria-label="활동 단계"><button class="active" data-step="reading" aria-current="step">사례 읽기</button><button data-step="design">마을 설계</button><button data-step="test">안전 시험</button><button data-step="export">발표 준비</button></nav>
</header>
<main class="is-reading">
  <section id="reading" aria-labelledby="readingTitle">
    <div class="reading-heading"><div><h2 id="readingTitle">실제 마을은 어떻게 대비했을까?</h2><p>위험을 고르고, 사람들이 마을을 어떻게 바꾸었는지 읽어 보세요.</p></div>
      <div id="readingTopics" role="group" aria-label="읽을 기후 위험"><button type="button" data-topic="heat">폭염</button><button type="button" data-topic="flood">집중호우</button><button type="button" data-topic="sea">해수면 상승</button></div>
    </div>
    <div class="reading-spread">
      <section class="case-shelf" aria-labelledby="shelfTitle"><h3 id="shelfTitle">폭염 사례</h3><div id="caseChoices" role="group" aria-labelledby="shelfTitle"></div></section>
      <article class="reading-sheet" aria-labelledby="caseTitle">
        <div class="case-hero"><div><p id="casePlace"></p><h3 id="caseTitle"></h3></div><figure><canvas id="caseArt" width="520" height="272" role="img"></canvas><figcaption>이해를 돕는 모형 그림</figcaption></figure></div>
        <div class="case-page"><div id="caseStory"></div><div class="case-think"><strong>우리 마을이라면?</strong><p id="caseQuestion"></p></div>
          <div class="case-end"><a id="caseSource" target="_blank" rel="noopener noreferrer"></a><button id="useCase" type="button"></button></div></div>
      </article>
    </div>
  </section>
  <section hidden class="stage" aria-label="입체 마을">
    <canvas id="village" width="950" height="740" tabindex="0" aria-label="입체 마을 지도. 설계할 때 시설을 빈 땅으로 끌거나 시설과 빈 땅을 차례로 눌러 옮깁니다. 빈 곳을 끌거나 방향 키를 누르면 시점이 바뀝니다."></canvas>
    <div class="overlay"><span class="sceneDot"></span><div><b id="scene">우리 모둠의 마을</b><small id="sceneState">설계 중</small></div></div>
    <div class="viewSelect"><span id="compass" aria-hidden="true">➤</span><select id="view" aria-label="마을을 보는 방향"><option value="orbit">자유 시점</option><option value="front">앞에서</option><option value="right">오른쪽에서</option><option value="back">뒤에서</option><option value="left">왼쪽에서</option><option value="top">위에서</option></select></div>
    <button id="heightMap" class="heightToggle" aria-pressed="false">땅 높이 지도</button>
    <div id="coastControls" hidden aria-label="해안 둑 구간"></div>
    <div id="movePreview" hidden aria-hidden="true">
      <svg width="100%" height="100%"><polygon id="moveTarget"></polygon></svg>
      <div id="moveBadge"><img alt=""><span></span></div>
    </div>
    <div id="placeTag" class="placeTag" hidden></div>
    <div class="mapFooter"><div class="legend"><span><i class="low">1</i>낮은 땅</span><span><i class="mid">2</i>중간 땅</span><span><i class="high">3</i>높은 땅</span><span id="riskKey" hidden><i class="risk"></i><em id="riskLabel">침수</em></span></div>
    <div class="camera" aria-label="화면 조절"><button id="turnLeft" title="왼쪽으로 회전" aria-label="왼쪽으로 회전">↶</button><button id="turnRight" title="오른쪽으로 회전" aria-label="오른쪽으로 회전">↷</button><i></i><button id="minus" title="축소" aria-label="축소">−</button><button id="plus" title="확대" aria-label="확대">＋</button><button id="fit" title="처음 시점" aria-label="처음 시점">⌖</button></div></div>
  </section>
  <aside hidden><div id="design" class="panel">
    <div><h2>마을 설계</h2><p class="sub" id="freePlots"></p></div>
    <div class="tabs" aria-label="시설 종류"><button data-group="safety" aria-pressed="true">안전 설계</button><button data-group="building">건물</button><button data-group="road">도로</button><button data-group="nature">녹지·쉼터</button></div>
    <div id="safetyPanel"><label for="designHazard">대비할 위험</label><select id="designHazard"><option value="flood">집중호우</option><option value="sea">해수면 상승</option><option value="heat">폭염</option></select><p id="strategy"></p></div>
    <div id="palette" class="palette"></div>
    <div class="tools"><button data-tool="look">둘러보기</button><button data-tool="move">옮기기</button><button data-tool="erase">지우기</button></div>
    <div class="hint" id="toolHint"></div>
    <button id="newCity" hidden>항구 도시 배치로 시작</button><div class="history"><button id="undo">↶ 되돌리기</button><button id="reset">처음 배치로</button></div>
  </div>
  <div id="test" class="panel" hidden><div><h2>안전 시험</h2><p class="sub">같은 위험에서 설계 전과 후를 비교해요.</p></div><div class="fields"><label>기후 위험<select id="hazard"><option value="flood">집중호우</option><option value="sea">해수면 상승</option><option value="heat">폭염</option></select></label><label>위험 세기<select id="severity"><option value="1">낮음</option><option value="2">보통</option><option value="3">높음</option></select></label></div><div class="tools"><button id="before">설계 전</button><button id="after">설계 후</button></div><div id="result" class="result"></div><p id="testObservation" class="hint"></p><small class="model" id="modelNote">수업용 모형이에요. 실제 침수 범위와 기온은 지역의 조건에 따라 달라져요.</small></div>
  <div id="export" class="panel" hidden><div><h2>캔바 발표 준비</h2><p class="sub">마을을 어떻게 바꿨는지 소개해요.</p></div><label>모둠 또는 마을 이름<input id="title" maxlength="30" placeholder="예. 3모둠 햇살마을"></label><label>설계와 시험 결과<textarea id="note" maxlength="120" rows="3" placeholder="어디를 바꿨나요? 시험 결과는 어땠나요?"></textarea></label><div class="downloads"><button id="png">전·후 비교 이미지 저장</button><button id="video">360° 회전 영상 저장</button></div><p class="sub">캔바의 ‘업로드’에서 저장한 파일을 넣어요.</p></div>
  <div id="status" role="status" aria-live="polite"></div>
  </aside>
</main></body></html>
